name: GitHub Pagesを更新
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * 6"
    - cron: "15 6 * * 6"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: カード画像の生成環境を準備
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          npm install --no-save sharp@0.34.4
      - run: node scripts/update-schedule.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: GitHub Pagesへ公開
        id: deployment
        uses: actions/deploy-pages@v4
