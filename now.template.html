<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>いまのスプラ予定 | すぷらいぶえきすぽ</title><style>
:root{color-scheme:dark;--ink:#d8ff3e;--text:#f7f8ff;--muted:#c6ccdf;--line:#73819e}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;color:var(--text);background:linear-gradient(#080b147a,#080b14ad),url("../spliveexpo/assets/bankara-sunset.jpg") center/cover fixed}main{width:min(1160px,100% - 36px);margin:auto;padding:clamp(22px,5vw,52px) 0}header{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:24px}h1{margin:0;font-size:clamp(1.7rem,4vw,2.7rem);line-height:1.12;text-shadow:0 2px 10px #000}.eyebrow{margin-bottom:7px;color:var(--ink);font-size:.82rem;letter-spacing:.15em;font-weight:900}.updated{color:var(--muted);font-size:.86rem;text-align:right}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{overflow:hidden;border:1px solid #8795b1;border-radius:23px;background:#101522bc;box-shadow:0 18px 48px #0008;backdrop-filter:blur(2px)}.card.xmatch{background:#102849bc;border-color:#6c9bd1}.card.bankara{background:#421921bc;border-color:#c5767e}.card.salmon{background:#173c25bc;border-color:#78b687}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:17px 20px;border-bottom:1px solid var(--line)}.xmatch .head{border-color:#6c9bd1}.bankara .head{border-color:#c5767e}.salmon .head{border-color:#78b687}.kind{font-weight:950;font-size:1.2rem}.time{color:var(--ink);font-weight:900;font-size:.84rem;text-align:right}.rule{padding:16px 20px 12px;font-size:1.65rem;font-weight:950}.stages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;padding:0 20px 20px}.stage{position:relative;overflow:hidden;min-width:0;aspect-ratio:1.72;border:1px solid var(--line);border-radius:13px;background:#111522}.stage img{width:100%;height:100%;object-fit:cover;display:block}.stage span{position:absolute;right:0;bottom:0;left:0;padding:7px 5px;background:#080b14d9;text-align:center;font-size:.9rem;font-weight:900}.salmon-main{display:grid;grid-template-columns:155px 1fr;gap:14px;padding:0 20px 20px}.weapons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;align-items:center}.weapon{min-width:0;border:1px solid var(--line);border-radius:9px;background:#111522;padding:4px}.weapon img{width:100%;aspect-ratio:1;object-fit:contain;display:block}.weapon span{display:block;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;font-size:.64rem;font-weight:800}.empty{padding:25px 20px;color:var(--muted)}@media(max-width:750px){header{align-items:start;flex-direction:column}.updated{text-align:left}.grid{grid-template-columns:1fr}.salmon-main{grid-template-columns:1fr}.weapons{grid-template-columns:repeat(4,1fr)}}
</style></head><body><main><header><div><div class="eyebrow">SPLATOON 3</div><h1>いまのスプラ予定</h1></div><div class="updated" id="updated">更新情報を取得中</div></header><section class="grid" id="grid"></section></main><script>
const e=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));const grid=document.querySelector("#grid");const stage=x=>`<div class="stage"><img src="${e(x.image)}" alt=""><span>${e(x.name)}</span></div>`;function matchCard(x,tone){if(!x)return `<article class="card"><div class="empty">現在の予定を取得できませんでした。</div></article>`;return `<article class="card ${tone}"><div class="head"><div class="kind">${e(x.kind)}</div></div><div class="rule">${e(x.rule)}</div><div class="stages">${x.stages.map(stage).join("")}</div></article>`}function salmonCard(x){if(!x)return "";return `<article class="card salmon"><div class="head"><div class="kind">サーモンラン</div><div class="time">${e(x.time)}</div></div><div class="salmon-main"><div>${stage(x.stage)}</div><div class="weapons">${x.weapons.map(w=>`<div class="weapon"><img src="${e(w.image)}" alt=""><span>${e(w.name)}</span></div>`).join("")}</div></div></article>`}fetch(`./now.json?v=${Date.now()}`,{cache:"no-store"}).then(r=>r.json()).then(d=>{document.querySelector("#updated").textContent=`最終更新：${d.updated}`;grid.innerHTML=[matchCard(d.xmatch,"xmatch"),matchCard(d.challenge,"bankara"),matchCard(d.open,"bankara"),salmonCard(d.salmon)].join("")}).catch(()=>grid.innerHTML='<article class="card"><div class="empty">予定を取得できませんでした。少し待って更新してください。</div></article>');
</script></body></html>
