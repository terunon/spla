<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スプラ3 現在のルール</title><meta property="og:type" content="website"><meta property="og:title" content="スプラ3 現在のルール"><meta property="og:image" content="https://terunon.github.io/spla/now/assets/Where.png"><meta name="twitter:card" content="summary_large_image"><link rel="icon" href="../favicon.svg" type="image/svg+xml"><style>
:root{color-scheme:dark;--ink:#d8ff3e;--text:#f7f8ff;--muted:#c6ccdf;--line:#73819e}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;color:var(--text);background:linear-gradient(#080b147a,#080b14ad),url("./assets/Where.png") center/cover fixed}main{width:min(1160px,100% - 36px);margin:auto;padding:clamp(22px,5vw,52px) 0}@media(min-width:751px){main{width:min(1160px,calc(100% - 220px));margin-left:auto;margin-right:clamp(40px,8vw,160px)}}header{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:24px}h1{margin:0;font-size:clamp(1.7rem,4vw,2.7rem);line-height:1.12;text-shadow:0 2px 10px #000}.eyebrow{margin-bottom:7px;color:var(--ink);font-size:.82rem;letter-spacing:.15em;font-weight:900}.header-side{display:grid;justify-items:end;gap:10px}.updated{color:var(--muted);font-size:.86rem;text-align:right}.controls{display:flex;gap:9px}.refresh,.share{border:1px solid var(--line);background:#181d2cc2;color:var(--text);border-radius:999px;min-height:40px;padding:0 14px;font:inherit;font-size:.86rem;font-weight:800;cursor:pointer}.share{border:0;background:var(--ink);color:#10131f;box-shadow:0 3px 0 #788f15}.refresh:disabled{opacity:.55;cursor:wait}.source{display:block;margin-top:4px;color:#aeb7c9;font-size:.68rem;text-decoration:none}.source:hover{text-decoration:underline}.note{margin:18px 4px 0;color:#edf0fa;font-size:.88rem;line-height:1.65;text-shadow:0 1px 5px #000}.note a{color:#cbd5e8}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{overflow:hidden;border:1px solid #8795b1;border-radius:23px;background:#101522bc;box-shadow:0 18px 48px #0008;backdrop-filter:blur(2px)}.card.xmatch{background:#102849bc;border-color:#6c9bd1}.card.bankara{background:#421921bc;border-color:#c5767e}.card.salmon{background:#173c25bc;border-color:#78b687}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:17px 20px;border-bottom:1px solid var(--line)}.xmatch .head{border-color:#6c9bd1}.bankara .head{border-color:#c5767e}.salmon .head{border-color:#78b687}.kind{font-weight:950;font-size:1.42rem}.next{position:absolute;top:50%;right:20px;width:255px;transform:translateY(-50%);overflow:hidden;padding:5px 7px;border:1px solid #000;border-radius:5px;background:#080b14d9;color:#c0c6d2;font-size:.7rem;font-weight:800;line-height:1.25;text-align:left}.next b,.next small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.next b{color:#d7dce8;font-size:.74rem}.next small{margin-top:2px;color:#aeb5c3;font-size:.67rem;font-weight:700}.time{color:var(--ink);font-weight:900;font-size:1.02rem;text-align:right}.rule{position:relative;padding:16px 20px 12px;font-size:1.65rem;font-weight:950}.stages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;padding:0 20px 20px}.stage{position:relative;overflow:hidden;min-width:0;aspect-ratio:1.72;border:1px solid var(--line);border-radius:13px;background:#111522}.stage img{width:100%;height:100%;object-fit:cover;display:block}.stage span{position:absolute;right:0;bottom:0;left:0;padding:7px 5px;background:#080b14d9;text-align:center;font-size:.9rem;font-weight:900}.salmon-main{display:grid;grid-template-columns:minmax(0,1fr) 213px;gap:14px;padding:14px 20px 20px}.salmon-main>.stage{aspect-ratio:1.52;align-self:center}.weapons{display:grid;grid-template-columns:repeat(2,102px);grid-template-rows:repeat(2,102px);justify-content:end;gap:9px;align-content:center}.weapon{min-width:0;aspect-ratio:1;border:1px solid var(--line);border-radius:11px;background:#111522;padding:7px}.weapon img{width:100%;height:100%;object-fit:contain;display:block}.empty{padding:25px 20px;color:var(--muted)}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#f7f8ff;color:#10131f;padding:11px 18px;border-radius:999px;font-weight:900;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:750px){main{margin:auto}header{align-items:start;flex-direction:column}.header-side{justify-items:start}.updated{text-align:left}.grid{grid-template-columns:1fr}.salmon-main{grid-template-columns:1fr}.weapons{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto}.weapon{width:100%}.next{right:14px;width:min(255px,62vw)}}
</style></head><body><main><header><div><div class="eyebrow">SPLATOON 3</div><h1 id="schedule-time">現在の時間帯</h1></div><div class="header-side"><div class="controls"><button class="share" id="copy-link">Discord用画像をコピー</button><button class="refresh" id="refresh">↻ 更新</button></div></div></header><section class="grid" id="grid"></section><p class="note">最終取得：<span id="updated">取得中</span><br><a href="https://splatoon3.ink/data/schedules.json" target="_blank" rel="noopener">情報源：https://splatoon3.ink/data/schedules.json</a></p></main><div class="toast" id="toast"></div><script src="./assets/spla-client.js"></script><script>
const C=window.SplaClient,e=C.esc,grid=document.querySelector("#grid"),scheduleTime=document.querySelector("#schedule-time"),updated=document.querySelector("#updated"),refresh=document.querySelector("#refresh"),copy=document.querySelector("#copy-link"),toast=document.querySelector("#toast");let state=null,timer=0,loading=false;
const stage=x=>`<div class="stage"><img src="${e(x.image)}" alt=""><span>${e(x.name)}</span></div>`;
function matchCard(x,tone){if(!x)return `<article class="card"><div class="empty">現在の予定を取得できませんでした。</div></article>`;return `<article class="card ${tone}"><div class="head"><div class="kind">${e(x.kind)}</div></div><div class="rule"><span>${e(x.rule)}</span><span class="next"><b>Next: ${e(x.nextRule||"未公開")}</b><small>${e(x.nextStages||"未公開")}</small></span></div><div class="stages">${x.stages.map(stage).join("")}</div></article>`}
function salmonCard(x){if(!x)return `<article class="card salmon"><div class="empty">サーモンランの予定を取得できませんでした。</div></article>`;return `<article class="card salmon"><div class="head"><div class="kind">サーモンラン</div><div class="time">${e(x.time)}</div></div><div class="salmon-main">${stage(x.stage)}<div class="weapons">${x.weapons.map(w=>`<div class="weapon"><img src="${e(w.image)}" alt=""></div>`).join("")}</div></div></article>`}
function notify(m){toast.textContent=m;toast.classList.add("show");clearTimeout(notify.t);notify.t=setTimeout(()=>toast.classList.remove("show"),2000)}
function render(d){state=d;updated.textContent=d.updated;scheduleTime.textContent=d.matchTime;grid.innerHTML=[matchCard(d.xmatch,"xmatch"),matchCard(d.challenge,"bankara"),salmonCard(d.salmon),matchCard(d.open,"bankara")].join("");clearTimeout(timer);const end=+new Date(d.endTime||0)-Date.now();if(end>0)timer=setTimeout(()=>load(true),end+800)}
async function load(silent=false){if(loading)return;loading=true;refresh.disabled=true;try{render(await C.latestNow());if(!silent)notify("最新の予定を取得しました")}catch(err){console.error(err);if(!state)grid.innerHTML='<article class="card"><div class="empty">予定を取得できませんでした。少し待ってから更新してください。</div></article>';notify(state?"更新に失敗しました。表示中の情報を保持しています。":"予定を取得できませんでした")}finally{loading=false;refresh.disabled=false}}
refresh.onclick=()=>load();document.addEventListener("visibilitychange",()=>{if(!document.hidden&&state&&+new Date(state.endTime||0)<=Date.now())load(true)});copy.onclick=async()=>{if(!state)return;copy.disabled=true;try{const blob=await C.cardNow(state);if(await C.clipboard(blob))notify("Discord用PNG画像をコピーしました");else{C.download(blob,"splatoon3-now.png");notify("画像コピー非対応のためPNGを保存しました")}}catch(err){console.error(err);notify("画像を生成できませんでした")}finally{copy.disabled=false}};load(true);
</script></body></html>
