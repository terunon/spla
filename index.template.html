<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131f">
  <meta name="description" content="土曜夜のバンカラマッチ（オープン）をDiscord向けに表示・コピー">
  <!-- OG_META_START --><title>スプラ土曜夜カード</title><!-- OG_META_END -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%2310131f'/%3E%3Cpath d='M13 44c-8-13 2-31 18-28 9-9 25 0 19 12 9 10-2 25-15 19-8 8-18 4-22-3Z' fill='%23d7ff39'/%3E%3Ccircle cx='26' cy='31' r='4' fill='%2310131f'/%3E%3Ccircle cx='39' cy='31' r='4' fill='%2310131f'/%3E%3C/svg%3E">
  <style>
    :root{color-scheme:dark;--bg:#0b0e17;--panel:#151927;--ink:#d8ff3e;--pink:#ff4db8;--cyan:#31dbe8;--text:#f7f8ff;--muted:#aeb5ca;--line:#30374d}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;color:var(--text);background:radial-gradient(circle at 15% 0%,#272052 0,transparent 33%),radial-gradient(circle at 90% 90%,#123b45 0,transparent 36%),var(--bg)}.shell{width:min(980px,100%);margin:auto;padding:clamp(18px,4vw,42px)}header{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:20px}h1{margin:0;font-size:clamp(1.4rem,4vw,2.35rem);line-height:1.15}.eyebrow{color:var(--ink);font-weight:900;font-size:.82rem;letter-spacing:.12em;margin-bottom:7px}.refresh{border:1px solid var(--line);background:#181d2c;color:var(--text);border-radius:999px;min-height:44px;padding:0 17px;font-weight:800;cursor:pointer}.card{overflow:hidden;border:1px solid #394158;border-radius:25px;background:linear-gradient(145deg,rgba(25,30,48,.98),rgba(14,17,29,.98));box-shadow:0 24px 65px #0006}.card-head{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:22px clamp(18px,4vw,32px);border-bottom:1px solid var(--line)}.date{font-size:clamp(1.3rem,3vw,1.8rem);font-weight:950}.mode{color:var(--muted);font-weight:700;text-align:right}#schedule{min-height:300px}.slot{display:grid;grid-template-columns:155px 1fr;gap:22px;padding:22px clamp(18px,4vw,32px)}.slot+.slot{border-top:1px solid var(--line)}.time{font-size:1.15rem;font-weight:950;color:var(--ink);padding-top:4px}.rule{margin:0 0 16px;font-size:clamp(1.25rem,3vw,1.75rem);font-weight:950}.stages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stage{min-width:0;display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px;background:#111522;font-weight:800}.stage img{width:72px;height:44px;object-fit:cover;border-radius:9px;background:#252b3d;flex:none}.state{min-height:300px;display:grid;place-content:center;gap:10px;text-align:center;color:var(--muted);padding:36px}.state strong{color:var(--text);font-size:1.15rem}.spinner{width:35px;height:35px;border:4px solid #31384d;border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite;margin:auto}@keyframes spin{to{transform:rotate(360deg)}}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}.action{min-height:52px;border:0;border-radius:14px;padding:10px 15px;color:#10131f;background:var(--ink);font:inherit;font-weight:950;cursor:pointer;box-shadow:0 7px 0 #788f15}.action:nth-child(2){background:var(--pink);box-shadow:0 7px 0 #89245e}.action:nth-child(3){background:var(--cyan);box-shadow:0 7px 0 #147b83}.action:nth-child(4){color:var(--text);background:#252b3d;box-shadow:0 7px 0 #10131f}.action:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}.note{margin:18px 4px 0;color:var(--muted);font-size:.88rem;line-height:1.65}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#f7f8ff;color:#10131f;padding:11px 18px;border-radius:999px;font-weight:900;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:650px){header{align-items:center}.slot{grid-template-columns:1fr;gap:8px}.stages,.actions{grid-template-columns:1fr}.mode{font-size:.85rem}}
  </style>
</head>
<body>
<main class="shell"><header><div><div class="eyebrow">SATURDAY NIGHT</div><h1>スプラ土曜夜カード</h1></div><button class="refresh" id="refresh">↻ 更新</button></header><section class="card"><div class="card-head"><div class="date" id="date">次の土曜日</div><div class="mode">バンカラマッチ<br>オープン</div></div><div id="schedule"><div class="state"><div class="spinner"></div><strong>スケジュールを取得中</strong></div></div></section><div class="actions"><button class="action" id="copyText" disabled>文章をコピー</button><button class="action" id="copyLink" disabled>Discord用URL</button><button class="action" id="copyImage" disabled>画像をコピー</button><button class="action" id="saveImage" disabled>PNGを保存</button></div><p class="note">土曜日21:00–23:00／23:00–翌1:00のバンカラマッチ（オープン）を表示します。情報はGitHub Actionsで自動更新されます。</p></main><div class="toast" id="toast"></div>
<script>
const API="./schedule.json";const $=id=>document.getElementById(id),els={date:$("date"),schedule:$("schedule"),refresh:$("refresh"),copyText:$("copyText"),copyLink:$("copyLink"),copyImage:$("copyImage"),saveImage:$("saveImage"),toast:$("toast")};let selected=null;
function notify(m){els.toast.textContent=m;els.toast.classList.add("show");clearTimeout(notify.t);notify.t=setTimeout(()=>els.toast.classList.remove("show"),1800)}function buttons(v){[els.copyText,els.copyLink,els.copyImage,els.saveImage].forEach(b=>b.disabled=!v)}function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}function textFor(d){const a=[`【${d.label} バンカラマッチ（オープン）】`,""];for(const s of d.slots){const t=s.hour===21?"21:00–23:00":"23:00–翌1:00";if(s.pending)a.push(`${t}　未公開`);else a.push(`${t}　${s.rule.name}`,...s.stages.map(x=>`・${x.name}`));a.push("")}return a.join("\n").trim()}
function render(d){selected=d;els.date.textContent=d.label;buttons(true);els.schedule.innerHTML=d.slots.map(s=>{const t=s.hour===21?"21:00–23:00":"23:00–翌1:00";if(s.pending)return `<article class="slot"><div class="time">${t}</div><h2 class="rule">未公開</h2></article>`;return `<article class="slot"><div class="time">${t}</div><div><h2 class="rule">${esc(s.rule.name)}</h2><div class="stages">${s.stages.map(x=>`<div class="stage"><img src="${esc(x.image)}" alt=""><span>${esc(x.name)}</span></div>`).join("")}</div></div></article>`}).join("")}
async function load(){els.refresh.disabled=true;try{const r=await fetch(`${API}?v=${Date.now()}`,{cache:"no-store"});if(!r.ok)throw Error(r.status);render(await r.json())}catch{selected=null;buttons(false);els.schedule.innerHTML='<div class="state"><strong>取得できませんでした</strong><span>少し待ってから更新してください。</span></div>'}finally{els.refresh.disabled=false}}
function canvas(){const c=document.createElement("canvas"),x=c.getContext("2d");c.width=1200;c.height=630;const g=x.createLinearGradient(0,0,1200,630);g.addColorStop(0,"#24204c");g.addColorStop(1,"#10333b");x.fillStyle=g;x.fillRect(0,0,1200,630);x.fillStyle="#151927";x.roundRect(48,45,1104,540,30);x.fill();x.fillStyle="#d8ff3e";x.font="900 24px system-ui";x.fillText("SATURDAY NIGHT",88,94);x.fillStyle="#f7f8ff";x.font="900 48px system-ui";x.fillText(selected.label,88,150);selected.slots.forEach((s,i)=>{const y=245+i*160,t=s.hour===21?"21:00–23:00":"23:00–翌1:00";x.fillStyle=i?"#31dbe8":"#d8ff3e";x.font="900 28px system-ui";x.fillText(t,88,y);x.fillStyle="#f7f8ff";x.font="900 34px system-ui";x.fillText(s.pending?"未公開":s.rule.name,350,y);x.fillStyle="#cbd1e2";x.font="700 25px system-ui";x.fillText(s.pending?"時間をおいて更新してください":s.stages.map(v=>v.name).join(" ／ "),350,y+42)});return c}const blob=c=>new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(),"image/png"));
els.refresh.onclick=load;els.copyText.onclick=async()=>{try{await navigator.clipboard.writeText(textFor(selected));notify("文章をコピーしました")}catch{notify("コピーできませんでした")}};els.copyLink.onclick=async()=>{try{const u=new URL(location.href);u.search=`date=${selected.date}`;await navigator.clipboard.writeText(u.href);notify("Discord用URLをコピーしました")}catch{notify("コピーできませんでした")}};els.copyImage.onclick=async()=>{try{await navigator.clipboard.write([new ClipboardItem({"image/png":await blob(canvas())})]);notify("画像をコピーしました")}catch{notify("PNG保存をご利用ください")}};els.saveImage.onclick=async()=>{const a=document.createElement("a");a.href=URL.createObjectURL(await blob(canvas()));a.download=`spla-${selected.date}.png`;a.click()};load();
</script></body></html>
