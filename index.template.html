<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131f">
  <!-- OG_META_START --><title>スプラ土曜夜カード</title><!-- OG_META_END -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%2310131f'/%3E%3Cpath d='M13 44c-8-13 2-31 18-28 9-9 25 0 19 12 9 10-2 25-15 19-8 8-18 4-22-3Z' fill='%23d7ff39'/%3E%3Ccircle cx='26' cy='31' r='4' fill='%2310131f'/%3E%3Ccircle cx='39' cy='31' r='4' fill='%2310131f'/%3E%3C/svg%3E">
  <style>
    :root{color-scheme:dark;--bg:#0b0e17;--ink:#d8ff3e;--text:#f7f8ff;--muted:#aeb5ca;--line:#71809c}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;color:var(--text);background:linear-gradient(#080b147a,#080b14ad),url("./assets/bankara-sunset.jpg?v=2") center/cover fixed,var(--bg)}.shell{width:min(1020px,100% - 36px);margin:0 auto;padding:clamp(18px,4vw,42px)}header{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:20px}h1{margin:0;font-size:clamp(1.4rem,4vw,2.35rem);line-height:1.15;text-shadow:0 2px 10px #000}.eyebrow{color:var(--ink);font-weight:900;font-size:.82rem;letter-spacing:.12em;margin-bottom:7px}.controls{display:flex;gap:9px}.refresh,.share{border:1px solid var(--line);background:#181d2cc2;color:var(--text);border-radius:999px;min-height:44px;padding:0 17px;font:inherit;font-weight:800;cursor:pointer}.share{border:0;background:var(--ink);color:#10131f;box-shadow:0 4px 0 #788f15}.share:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}.card{overflow:hidden;border:1px solid #8594b0;border-radius:25px;background:#101522bc;box-shadow:0 24px 65px #0008;backdrop-filter:blur(2px)}.card-head{padding:22px clamp(18px,4vw,32px);border-bottom:1px solid var(--line)}.date{font-size:clamp(1.3rem,3vw,1.8rem);font-weight:950}.mode{display:none}#schedule{min-height:300px}.slot{display:grid;grid-template-columns:260px 1fr;gap:26px;padding:20px clamp(18px,4vw,32px)}.slot+.slot{border-top:1px solid var(--line)}.time{font-size:clamp(1.15rem,2.4vw,1.55rem);font-weight:950;color:var(--ink);padding-top:8px}.rule{margin:12px 0 0;font-size:clamp(1.45rem,3.2vw,2.05rem);font-weight:950;line-height:1.18}.stages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.stage{position:relative;min-width:0;aspect-ratio:1.73;overflow:hidden;border:1px solid var(--line);border-radius:15px;background:#111522}.stage img{width:100%;height:100%;object-fit:cover;display:block}.stage span{position:absolute;right:0;bottom:0;left:0;padding:8px 6px;color:#fff;background:#080b14d9;text-align:center;font-weight:900;font-size:clamp(.85rem,1.8vw,1.1rem);line-height:1.2}.state{min-height:300px;display:grid;place-content:center;gap:10px;text-align:center;color:var(--muted);padding:36px}.state strong{color:var(--text);font-size:1.15rem}.spinner{width:35px;height:35px;border:4px solid #31384d;border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite;margin:auto}@keyframes spin{to{transform:rotate(360deg)}}.note{margin:18px 4px 0;color:#edf0fa;font-size:.88rem;line-height:1.65;text-shadow:0 1px 5px #000}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#f7f8ff;color:#10131f;padding:11px 18px;border-radius:999px;font-weight:900;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(min-width:1000px){.shell{margin-left:auto;margin-right:clamp(28px,7vw,135px)}}@media(max-width:650px){header{align-items:center}.controls{gap:6px}.refresh,.share{padding:0 11px;font-size:.85rem}.slot{grid-template-columns:1fr;gap:10px}.time{padding-top:0}.rule{margin-top:6px}}
  </style>
</head>
<body>
<main class="shell"><header><div><div class="eyebrow">SATURDAY NIGHT</div><h1>スプラ土曜夜カード</h1></div><div class="controls"><button class="share" id="copyLink" disabled>Discord用URLをコピー</button><button class="refresh" id="refresh">↻ 更新</button></div></header><section class="card"><div class="card-head"><div class="date" id="date">次の土曜日</div><div class="mode">バンカラマッチ<br>オープン</div></div><div id="schedule"><div class="state"><div class="spinner"></div><strong>スケジュールを取得中</strong></div></div></section><p class="note">土曜日21:00–23:00／23:00–翌1:00のバンカラマッチ（オープン）を表示します。情報はGitHub Actionsで自動更新されます。</p></main><div class="toast" id="toast"></div>
<script>
const API="./schedule.json";const $=id=>document.getElementById(id),els={date:$("date"),schedule:$("schedule"),refresh:$("refresh"),copyLink:$("copyLink"),toast:$("toast")};let selected=null;
function notify(m){els.toast.textContent=m;els.toast.classList.add("show");clearTimeout(notify.t);notify.t=setTimeout(()=>els.toast.classList.remove("show"),1800)}function buttons(v){els.copyLink.disabled=!v}function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function render(d){selected=d;els.date.textContent=`${d.label}　バンカラマッチ（オープン）`;buttons(true);els.schedule.innerHTML=d.slots.map(s=>{const t=s.hour===21?"21:00–23:00":"23:00–翌1:00";if(s.pending)return `<article class="slot"><div><div class="time">${t}</div><h2 class="rule">未公開</h2></div></article>`;return `<article class="slot"><div><div class="time">${t}</div><h2 class="rule">${esc(s.rule.name)}</h2></div><div class="stages">${s.stages.map(x=>`<div class="stage"><img src="${esc(x.image)}" alt=""><span>${esc(x.name)}</span></div>`).join("")}</div></article>`}).join("")}
async function load(){els.refresh.disabled=true;try{const r=await fetch(`${API}?v=${Date.now()}`,{cache:"no-store"});if(!r.ok)throw Error(r.status);render(await r.json())}catch{selected=null;buttons(false);els.schedule.innerHTML='<div class="state"><strong>取得できませんでした</strong><span>少し待ってから更新してください。</span></div>'}finally{els.refresh.disabled=false}}
els.refresh.onclick=load;els.copyLink.onclick=async()=>{try{const u=new URL(location.href);u.search=`date=${selected.date}&card=6`;await navigator.clipboard.writeText(u.href);notify("Discord用URLをコピーしました")}catch{notify("コピーできませんでした")}};load();
</script></body></html>
